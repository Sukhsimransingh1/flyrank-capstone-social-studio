services:
  db:
    image: postgres:16-alpine
    container_name: social-studio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: socialstudio
      POSTGRES_PASSWORD: socialstudio
      POSTGRES_DB: socialstudio
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialstudio -d socialstudio"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: social-studio-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://socialstudio:socialstudio@db:5432/socialstudio
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
